    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at 20% 20%, #2a1a3e, #150b26);
            background: linear-gradient(145deg, #1a0f2a 0%, #2a1a4a 45%, #1f1435 100%);
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
            color: #f0eaf8;
            position: relative;
            overflow-x: hidden;
        }

        /* 紫色动态光晕 */
        body::before {
            content: "";
            position: fixed;
            top: -30%;
            left: -20%;
            width: 70vw;
            height: 70vh;
            background: radial-gradient(circle, rgba(200, 130, 255, 0.35), transparent 70%);
            filter: blur(90px);
            animation: glowShift 12s infinite alternate ease-in-out;
            z-index: 0;
            pointer-events: none;
        }

        body::after {
            content: "";
            position: fixed;
            bottom: -30%;
            right: -20%;
            width: 70vw;
            height: 70vh;
            background: radial-gradient(circle, rgba(150, 80, 255, 0.3), transparent 70%);
            filter: blur(90px);
            animation: glowShift2 14s infinite alternate ease-in-out;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes glowShift {
            0% { transform: translate(0, 0) scale(1); opacity: 0.6; }
            50% { transform: translate(30px, 40px) scale(1.2); opacity: 0.9; }
            100% { transform: translate(-20px, 10px) scale(0.9); opacity: 0.5; }
        }

        @keyframes glowShift2 {
            0% { transform: translate(0, 0) scale(1); opacity: 0.5; }
            50% { transform: translate(-40px, -30px) scale(1.1); opacity: 0.8; }
            100% { transform: translate(20px, -10px) scale(0.95); opacity: 0.4; }
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 430px;
            background: rgba(30, 20, 50, 0.65);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(220, 180, 255, 0.18);
            border-radius: 32px;
            padding: 2.8rem 2rem 2.2rem;
            text-align: center;
            box-shadow: 
                0 25px 50px -12px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            transition: all 0.2s ease;
        }

        .logo-icon {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            display: inline-block;
            filter: drop-shadow(0 0 18px rgba(200, 150, 255, 0.5));
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 650;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
            color: #ffffff;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }

        .subtitle {
            font-size: 0.95rem;
            color: #d5c8ec;
            margin-bottom: 2.2rem;
            line-height: 1.6;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.7rem;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(220, 180, 255, 0.2);
            border-radius: 60px;
            padding: 1rem 1.3rem;
            font-size: 1.05rem;
            font-weight: 600;
            color: #f6f0ff;
            text-decoration: none;
            transition: all 0.25s cubic-bezier(0.2, 0, 0, 1);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
            letter-spacing: -0.01em;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }

        .btn:hover {
            background: rgba(220, 180, 255, 0.15);
            border-color: rgba(220, 180, 255, 0.45);
            transform: translateY(-2px);
            box-shadow: 0 16px 28px -8px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.03);
        }

        .btn:active {
            transform: translateY(0);
            box-shadow: 0 6px 14px -4px rgba(0, 0, 0, 0.4);
            transition: 0.06s;
        }

        .btn-icon {
            font-size: 1.4rem;
            line-height: 1;
        }

        .btn-primary {
            background: linear-gradient(135deg, #5a2a8c, #3a1a5e);
            border-color: rgba(220, 180, 255, 0.35);
            color: #ffffff;
            box-shadow: 0 10px 22px -8px rgba(90, 42, 140, 0.7);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #7a3ab0, #4a2a78);
            border-color: rgba(220, 180, 255, 0.55);
        }

        .note {
            margin-top: 2.2rem;
            font-size: 0.8rem;
            color: #cdbce8;
            background: rgba(255, 255, 255, 0.03);
            padding: 0.7rem 1.2rem;
            border-radius: 40px;
            display: inline-block;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(220, 180, 255, 0.12);
        }

        @media (max-width: 430px) {
            .container {
                padding: 2rem 1.2rem 1.8rem;
                border-radius: 26px;
            }
            h1 {
                font-size: 1.6rem;
            }
            .btn {
                padding: 0.9rem 1.1rem;
                font-size: 1rem;
            }
        }
    </style>
